name: Ring0 CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  # The eBPF crate is built by xtask with a pinned nightly (nightly-2025-05-01,
  # LLVM 20 — newer nightlies emit verifier-rejected BPF code), so CI installs
  # rustup-managed toolchains instead of relying on the distro rustc.

jobs:
  lint:
    runs-on: ubuntu-latest
    container: fedora:41
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          dnf install -y clang llvm-devel kernel-devel \
            cmake hyperscan-devel rocksdb-devel capnproto-devel \
            qt6-qtbase-devel qt6-qtdeclarative-devel
      - name: Setup Rust (rustup stable)
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --no-modify-path --profile minimal --default-toolchain stable \
              --component rustfmt,clippy,rust-src
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Rustfmt check
        run: cargo fmt --all -- --check
      - name: Clippy
        # ring0-ebpf is a BPF-target crate (nightly + bpfel-unknown-none); it is
        # linted by the eBPF build instead of the workspace clippy pass.
        run: cargo clippy --workspace --exclude ring0-ebpf -- -D warnings

  build:
    runs-on: ubuntu-latest
    container: fedora:41
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          dnf install -y clang llvm-devel kernel-devel \
            cmake hyperscan-devel rocksdb-devel capnproto-devel
      - name: Setup Rust (rustup stable + pinned nightly)
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --no-modify-path --profile minimal --default-toolchain stable \
              --component rustfmt,clippy,rust-src
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          rustup toolchain install nightly-2025-05-01 --profile minimal --component rust-src
          rustup target add bpfel-unknown-none --toolchain nightly-2025-05-01
          rustup default stable
      - name: Build eBPF
        run: cargo xtask build
      - name: Build user-space
        run: cargo build --release -p ring0-common -p ring0d -p ring0ctl

  test:
    runs-on: ubuntu-latest
    container: fedora:41
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          dnf install -y clang llvm-devel kernel-devel \
            cmake hyperscan-devel rocksdb-devel capnproto-devel \
            bpftool
      - name: Setup Rust (rustup stable + pinned nightly)
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --no-modify-path --profile minimal --default-toolchain stable \
              --component rustfmt,clippy,rust-src
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          rustup toolchain install nightly-2025-05-01 --profile minimal --component rust-src
          rustup target add bpfel-unknown-none --toolchain nightly-2025-05-01
          rustup default stable
      - name: Build eBPF
        run: cargo xtask build
      - name: Run unit tests
        run: cargo test --workspace --exclude ring0-gui --exclude ring0-ebpf
      - name: Run integration tests
        run: |
          cargo build --release -p ring0d -p ring0ctl
          bash tests/scripts/e2e.sh || echo "Some e2e tests skipped (no kernel BPF)"

  gui:
    runs-on: ubuntu-latest
    container: fedora:41
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt6 + Rust
        run: |
          dnf install -y qt6-qtbase-devel qt6-qtdeclarative-devel \
            cmake clang
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --no-modify-path --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Build GUI
        run: cargo build --release -p ring0-gui

  bench:
    runs-on: ubuntu-latest
    container: fedora:41
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies + Rust
        run: |
          dnf install -y clang cmake hyperscan-devel rocksdb-devel capnproto-devel
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --no-modify-path --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Run benchmarks
        run: cargo bench -p ring0d || echo "Benchmarks require nightly"

  package:
    runs-on: ubuntu-latest
    container: fedora:41
    needs: [test, gui]
    steps:
      - uses: actions/checkout@v4
      - name: Install RPM build tools
        run: dnf install -y rpm-build rpkg
      - name: Build SRPM
        run: |
          rpkg srpm --outdir .
      - name: Upload SRPM
        uses: actions/upload-artifact@v4
        with:
          name: ring0-srpm
          path: "*.src.rpm"
