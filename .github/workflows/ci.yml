name: Ring0 CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: nightly

jobs:
  lint:
    runs-on: ubuntu-latest
    container: fedora:41
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          dnf install -y rust cargo clang llvm-devel kernel-devel \
            cmake hyperscan-devel rocksdb-devel capnproto-devel \
            qt6-qtbase-devel qt6-qtdeclarative-devel
      - name: Rustfmt check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace -- -D warnings

  build:
    runs-on: ubuntu-latest
    container: fedora:41
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          dnf install -y rust cargo clang llvm-devel kernel-devel \
            cmake hyperscan-devel rocksdb-devel capnproto-devel
      - name: Build eBPF
        run: cargo xtask build
      - name: Build user-space
        run: cargo build --release -p ring0-common -p ring0d -p ring0ctl

  test:
    runs-on: ubuntu-latest
    container: fedora:41
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          dnf install -y rust cargo clang llvm-devel kernel-devel \
            cmake hyperscan-devel rocksdb-devel capnproto-devel \
            bpftool
      - name: Build eBPF
        run: cargo xtask build
      - name: Run unit tests
        run: cargo test --workspace --exclude ring0-gui --exclude ring0-ebpf
      - name: Run integration tests
        run: |
          cargo build --release -p ring0d -p ring0ctl
          bash tests/scripts/e2e.sh || echo "Some e2e tests skipped (no kernel BPF)"

  gui:
    runs-on: ubuntu-latest
    container: fedora:41
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt6
        run: |
          dnf install -y rust cargo qt6-qtbase-devel qt6-qtdeclarative-devel \
            cmake clang
      - name: Build GUI
        run: cargo build --release -p ring0-gui

  bench:
    runs-on: ubuntu-latest
    container: fedora:41
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          dnf install -y rust cargo clang cmake hyperscan-devel rocksdb-devel capnproto-devel
      - name: Run benchmarks
        run: cargo bench -p ring0d || echo "Benchmarks require nightly"

  package:
    runs-on: ubuntu-latest
    container: fedora:41
    needs: [test, gui]
    steps:
      - uses: actions/checkout@v4
      - name: Install RPM build tools
        run: dnf install -y rpm-build rpkg
      - name: Build SRPM
        run: |
          rpkg srpm --outdir .
      - name: Upload SRPM
        uses: actions/upload-artifact@v4
        with:
          name: ring0-srpm
          path: "*.src.rpm"
