# .dist/copr/project.conf
# Copr project configuration for Ring0
# https://copr.fedorainfracloud.org/coprs/ring0/ring0/

[rpm]
spec = dist/rpm/ring0.spec
srpm_build_method = rpkg
separate_build_chroots = True

[releases]
fedora-40-x86_64 = True
fedora-40-aarch64 = True
fedora-41-x86_64 = True
fedora-41-aarch64 = True
fedora-rawhide-x86_64 = True
fedora-rawhide-aarch64 = True
epel-9-x86_64 = True
epel-9-aarch64 = True

[packages]
ring0 = Path: .
