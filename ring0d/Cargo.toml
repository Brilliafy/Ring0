[package]
name = "ring0d"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
aya = "0.13"
rocksdb = "0.22"
hyperscan = "0.3"
capnp = "0.21"
capnp-rpc = "0.21"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ring0-common = { path = "../ring0-common" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json"] }
signal-hook = "0.3"
signal-hook-tokio = { version = "0.3", features = ["futures-v0_3"] }
procfs = "0.17"
libc = "0.2"
num_cpus = "1"
serde_yaml = "0.9"
glob = "0.3"
shellexpand = "3"
parking_lot = "0.12"
once_cell = "1"
dashmap = "6"
sha2 = "0.10"
reqwest = { version = "0.12", features = ["rustls-tls"], default-features = false }
arc-swap = "1"
hickory-resolver = "0.24"
sysinfo = "0.33"
maxminddb = "0.24"
lru-cache = "0.1"
aho-corasick = "1"
futures-util = { version = "0.3", features = ["async-await"] }

[dev-dependencies]
divan = "0.1"
