[package]
name = "ring0d"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
aya = "0.14"
rocksdb = "0.24"
hyperscan = "0.3"
capnp = "0.26"
capnp-rpc = "0.26"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ring0-common = { path = "../ring0-common" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
signal-hook = "0.4"
signal-hook-tokio = { version = "0.4", features = ["futures-v0_3"] }
procfs = "0.18"
libc = "0.2"
num_cpus = "1"
serde_yaml = "0.9"
glob = "0.3"
shellexpand = "3"
parking_lot = "0.12"
once_cell = "1"
dashmap = "6"
sha2 = "0.11"
reqwest = { version = "0.13", features = ["rustls", "webpki-roots"], default-features = false }
arc-swap = "1"
hickory-resolver = "0.26"
sysinfo = "0.39"
maxminddb = "0.30"
lru-cache = "0.1"
aho-corasick = "1"
futures-util = { version = "0.3", features = ["async-await"] }
hex = "0.4"
flate2 = "1"
tar = "0.4"
zbus = "5"

[dev-dependencies]
divan = "0.1"
